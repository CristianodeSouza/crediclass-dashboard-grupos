{% extends "base.html" %}

{% block title %}Gerenciador - {{ app_title }}{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-3xl font-bold text-gray-900">Gerenciador de Grupos</h2>
        <a href="/grupos/novo" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700">
            + Novo Grupo
        </a>
    </div>

    <div class="bg-white rounded-lg shadow-sm p-6">
        <p class="text-gray-600 mb-4">
            Gerencie todos os grupos de consórcio. Crie, edite ou delete grupos conforme necessário.
        </p>

        <div class="mt-6 text-center text-gray-500">
            <p>Acessar gerenciador na aba <a href="/" class="text-blue-600 hover:text-blue-900">Grupos</a></p>
        </div>
    </div>
</div>
{% endblock %}
