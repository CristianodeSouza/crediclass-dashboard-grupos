{% extends "base.html" %}

{% block title %}{% if modo == 'novo' %}Novo Grupo{% else %}Editar Grupo{% endif %} - {{ app_title }}{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <h2 class="text-3xl font-bold text-gray-900 mb-6">
        {% if modo == 'novo' %}Novo Grupo{% else %}Editar Grupo: {{ grupo.grupo }}{% endif %}
    </h2>

    <form method="post" class="bg-white rounded-lg shadow-sm p-6 space-y-6">
        <!-- Grupo -->
        <div>
            <label for="grupo" class="block text-sm font-medium text-gray-700">Número do Grupo *</label>
            <input
                type="text"
                name="grupo"
                id="grupo"
                value="{% if grupo %}{{ grupo.grupo }}{% endif %}"
                {% if modo == 'editar' %}readonly{% endif %}
                required
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-3 py-2"
            />
        </div>

        <!-- Administradora -->
        <div>
            <label for="adm" class="block text-sm font-medium text-gray-700">Administradora *</label>
            <select name="adm" id="adm" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-3 py-2">
                <option value="">Selecione...</option>
                {% for adm in administradoras %}
                    <option value="{{ adm }}" {% if grupo and grupo.adm == adm %}selected{% endif %}>{{ adm }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Tipo de Bem -->
        <div>
            <label for="tipo_bem" class="block text-sm font-medium text-gray-700">Tipo de Bem *</label>
            <select name="tipo_bem" id="tipo_bem" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-3 py-2">
                <option value="">Selecione...</option>
                {% for tipo in tipos_bem %}
                    <option value="{{ tipo }}" {% if grupo and grupo.tipo_bem == tipo %}selected{% endif %}>{{ tipo }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Valores Financeiros -->
        <fieldset class="border-t border-gray-200 pt-6">
            <legend class="text-lg font-medium text-gray-900">Valores Financeiros</legend>

            <div class="grid grid-cols-2 gap-4 mt-4">
                <div>
                    <label for="maior_credito" class="block text-sm font-medium text-gray-700">Maior Crédito (R$)</label>
                    <input
                        type="number"
                        name="maior_credito"
                        id="maior_credito"
                        step="0.01"
                        value="{% if grupo %}{{ grupo.maior_credito or '' }}{% endif %}"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-3 py-2"
                    />
                </div>

                <div>
                    <label for="menor_credito" class="block text-sm font-medium text-gray-700">Menor Crédito (R$)</label>
                    <input
                        type="number"
                        name="menor_credito"
                        id="menor_credito"
                        step="0.01"
                        value="{% if grupo %}{{ grupo.menor_credito or '' }}{% endif %}"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-3 py-2"
                    />
                </div>

                <div>
                    <label for="taxa_adm" class="block text-sm font-medium text-gray-700">Taxa ADM (%)</label>
                    <input
                        type="number"
                        name="taxa_adm"
                        id="taxa_adm"
                        step="0.01"
                        value="{% if grupo %}{{ grupo.taxa_adm or '' }}{% endif %}"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-3 py-2"
                    />
                </div>

                <div>
                    <label for="fundo_rsv" class="block text-sm font-medium text-gray-700">Fundo de Reserva (%)</label>
                    <input
                        type="number"
                        name="fundo_rsv"
                        id="fundo_rsv"
                        step="0.01"
                        value="{% if grupo %}{{ grupo.fundo_rsv or '' }}{% endif %}"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-3 py-2"
                    />
                </div>

                <div>
                    <label for="investidor" class="block text-sm font-medium text-gray-700">Investidor (%)</label>
                    <input
                        type="number"
                        name="investidor"
                        id="investidor"
                        step="0.01"
                        value="{% if grupo %}{{ grupo.investidor or '' }}{% endif %}"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-3 py-2"
                    />
                </div>

                <div>
                    <label for="conservador_24m" class="block text-sm font-medium text-gray-700">Conservador 24M (%)</label>
                    <input
                        type="number"
                        name="conservador_24m"
                        id="conservador_24m"
                        step="0.01"
                        value="{% if grupo %}{{ grupo.conservador_24m or '' }}{% endif %}"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-3 py-2"
                    />
                </div>

                <div>
                    <label for="moderado_12m" class="block text-sm font-medium text-gray-700">Moderado 12M (%)</label>
                    <input
                        type="number"
                        name="moderado_12m"
                        id="moderado_12m"
                        step="0.01"
                        value="{% if grupo %}{{ grupo.moderado_12m or '' }}{% endif %}"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border px-3 py-2"
                    />
                </div>
            </div>
        </fieldset>

        <!-- Botões -->
        <div class="flex gap-4 pt-6 border-t border-gray-200">
            <button type="submit" class="flex-1 px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                {% if modo == 'novo' %}Criar Grupo{% else %}Salvar Alterações{% endif %}
            </button>
            <a href="/" class="flex-1 px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 text-center">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
