<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crediclass Dashboard Grupos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
  </head>
  <body>
    <main class="container-fluid px-4 py-3">
      <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
        <div>
          <h1 class="h3 mb-1">Crediclass Dashboard Grupos</h1>
          <div id="statusText" class="text-secondary small">Carregando dados...</div>
        </div>
        <div class="d-flex gap-2">
          <button id="reloadBtn" class="btn btn-outline-secondary" type="button">Atualizar Dados</button>
          <button id="newBtn" class="btn btn-primary" type="button">Novo Grupo</button>
        </div>
      </header>

      <section class="filters row g-2 align-items-end mb-3">
        <div class="col-12 col-md-4 col-lg-3">
          <label for="admFilter" class="form-label">Administradora</label>
          <select id="admFilter" class="form-select">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="col-12 col-md-5 col-lg-4">
          <label for="searchInput" class="form-label">Buscar grupo</label>
          <input id="searchInput" class="form-control" type="search" placeholder="Numero, ID ou administradora">
        </div>
      </section>

      <div class="table-responsive">
        <table class="table table-hover table-sm align-middle">
          <thead>
            <tr>
              <th>Administradora</th>
              <th>Grupo</th>
              <th>Tipo de Bem</th>
              <th>Menor Credito</th>
              <th>Maior Credito</th>
              <th>Prazo</th>
              <th>Prestacao Integral</th>
              <th>Taxa Administracao</th>
              <th>Status</th>
              <th class="text-end">Acoes</th>
            </tr>
          </thead>
          <tbody id="groupsTable"></tbody>
        </table>
      </div>
    </main>

    <div class="modal fade" id="groupModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <form id="groupForm" class="modal-content">
          <div class="modal-header">
            <h2 id="modalTitle" class="modal-title h5">Grupo</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <ul class="nav nav-tabs" role="tablist">
              <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-general" type="button">Dados Gerais</button></li>
              <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-2024" type="button">Historico 2024</button></li>
              <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-2025" type="button">Historico 2025</button></li>
              <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-2026" type="button">Historico 2026</button></li>
            </ul>
            <div class="tab-content pt-3">
              <div id="tab-general" class="tab-pane fade show active">
                <div id="generalFields" class="row g-3"></div>
              </div>
              <div id="tab-2024" class="tab-pane fade"><div class="table-responsive" data-history-year="2024"></div></div>
              <div id="tab-2025" class="tab-pane fade"><div class="table-responsive" data-history-year="2025"></div></div>
              <div id="tab-2026" class="tab-pane fade"><div class="table-responsive" data-history-year="2026"></div></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button id="saveBtn" type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
