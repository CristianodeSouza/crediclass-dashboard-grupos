services:
  - type: web
    name: crediclass-dashboard-grupos-v2
    runtime: python
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
